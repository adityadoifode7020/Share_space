{% extends "base.html" %}{% block title %}Create account · ShareSpace{% endblock %}
{% block content %}<section class="auth-card register-card"><div class="eyebrow">JOIN THE COMMUNITY</div><h2>Create your account</h2><p class="muted">New accounts start unverified. A manager can review your profile.</p>
<form method="post" class="stack"><label>Full name<input name="name" required maxlength="100"></label><label>Email address<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><label>Account type<select name="role"><option value="user">Student / borrower</option><option value="owner">Resource owner</option></select></label><button class="btn primary full">Create account</button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
